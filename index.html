<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서울면목북부</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Noto Sans KR", sans-serif;
  background: #faf7f2;
  color: #4b4b4b;
}

/* 🌸 메인 배경 */
.hero {
  height: 60vh;
  background: linear-gradient(135deg, #ffe8dc, #e6f3e8);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
}

/* 제목 크게 */
.hero h1 {
  font-size: 3.2rem;
  margin: 0;
  color: #6f5a52;
}

/* 문구 */
.hero p {
  margin-top: 18px;
  font-size: 1.2rem;
  color: #6b625b;
}

/* 메뉴 */
nav {
  position: sticky;
  top: 0;
  background: #fffaf4;
  border-bottom: 1px solid #eee;
  z-index: 1000;
}

.menu {
  max-width: 1200px;
  margin: 0 auto;
  padding: 12px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}

.menu button {
  border: none;
  background: transparent;
  padding: 10px 16px;
  border-radius: 20px;
  cursor: pointer;
  font-weight: 600;
  color: #5f7f68;
}

.menu button.active {
  background: #ffe8dc;
}

/* 내용 영역 */
main {
  max-width: 1000px;
  margin: 40px auto;
  padding: 0 20px;
}

.content {
  background: white;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}

.tab {
  display: none;
}

.tab.active {
  display: block;
}

h2 {
  margin-top: 0;
  color: #6f5a52;
}

/* 반응형 */
@media(max-width: 768px){
  .hero h1 { font-size: 2.2rem; }
}
</style>
</head>

<body>

<!-- 🌸 첫 화면 (배경) -->
<section class="hero">
  <h1>서울 면목 북부</h1>
  <p>안녕하세요. 서울 면목 북부에 오신 모든 분들을 환영합니다.</p>
</section>

<!-- 메뉴 -->
<nav>
  <div class="menu">
    <button class="active" onclick="showTab('about', this)">회중 소개</button>
    <button onclick="showTab('area', this)">구역 소개</button>
    <button onclick="showTab('service', this)">봉사 안내</button>
    <button onclick="showTab('meeting', this)">집회 안내</button>
    <button onclick="showTab('contact', this)">문의하기</button>
    <button onclick="showTab('parking', this)">주차장 안내</button>
    <button onclick="showTab('stay', this)">숙박시설 안내</button>
  </div>
</nav>

<!-- 내용 -->
<main>
  <div class="content">

    <section id="about" class="tab active">
      <h2>회중 소개</h2>
      <p>회중에 대한 소개 내용을 이곳에 작성하시면 됩니다.</p>
    </section>

    <section id="area" class="tab">
      <h2>구역 소개</h2>
      <p>구역에 대한 설명을 작성하세요.</p>
    </section>

    <section id="service" class="tab">
      <h2>봉사 안내</h2>
      <p>봉사 일정과 안내를 작성하세요.</p>
    </section>

    <section id="meeting" class="tab">
      <h2>집회 안내</h2>
      <p>집회 시간과 장소를 입력하세요.</p>
    </section>

    <section id="contact" class="tab">
      <h2>문의하기</h2>
      <p>연락 방법을 작성하세요.</p>
    </section>

    <section id="parking" class="tab">
      <h2>주차장 안내</h2>
      <p>주차 안내를 작성하세요.</p>
    </section>

    <section id="stay" class="tab">
      <h2>숙박시설 안내</h2>
      <p>숙박 정보 작성.</p>
    </section>

  </div>
</main>

<script>
function showTab(id, el){
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.menu button').forEach(b => b.classList.remove('active'));

  document.getElementById(id).classList.add('active');
  el.classList.add('active');
}
</script>

</body>
</html>
