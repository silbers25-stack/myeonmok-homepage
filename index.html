<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>서울면목북부</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #222;
      line-height: 1.6;
    }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 24px;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 12px;
    }
    p {
      font-size: 1.05rem;
      color: #555;
    }
    .box {
      margin-top: 32px;
      padding: 24px;
      border: 1px solid #e5e5e5;
      border-radius: 16px;
      background: #fafafa;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>서울면목북부</h1>
    <p>누구나 편안하게 방문할 수 있는 따뜻한 모임입니다.</p>

    <div class="box">
      <h2>환영합니다</h2>
      <p>성경에 대해 알아보고 싶거나 집회에 참석해 보고 싶으신 분들을 따뜻하게 맞이합니다.</p>
    </div>
  </div>
</body>
</html>
