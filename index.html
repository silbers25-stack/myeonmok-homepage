<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>서울면목북부</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #222;
    }
    header {
      width: 100%;
      border-bottom: 1px solid #eee;
      background: #fff;
    }
    .nav {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-size: 1rem;
      font-weight: bold;
      color: #111;
    }
    .menu a {
      margin-left: 18px;
      text-decoration: none;
      color: #444;
      font-size: 0.95rem;
    }
    .hero {
      min-height: calc(100vh - 70px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .container {
      max-width: 760px;
    }
    h1 {
      font-size: 2.8rem;
      margin-bottom: 20px;
      line-height: 1.3;
    }
    p {
      font-size: 1.1rem;
      color: #555;
      line-height: 1.8;
      margin: 0;
    }
    .sub {
      margin-top: 16px;
    }
    .buttons {
      margin-top: 32px;
    }
    .buttons a {
      display: inline-block;
      margin: 8px;
      padding: 13px 22px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 0.95rem;
    }
    .primary {
      background: #111;
      color: #fff;
    }
    .secondary {
      border: 1px solid #ccc;
      color: #333;
      background: #fff;
    }
  </style>
</head>
<body>
  <nav style="background:#2c3e50; padding:15px;">
  <ul style="list-style:none; display:flex; justify-content:center; gap:25px; margin:0; padding:0;">
    <li><a href="#about" style="color:white; text-decoration:none;">회중 소개</a></li>
    <li><a href="#area" style="color:white; text-decoration:none;">구역 소개</a></li>
    <li><a href="#service" style="color:white; text-decoration:none;">봉사 안내</a></li>
    <li><a href="#meeting" style="color:white; text-decoration:none;">집회 안내</a></li>
    <li><a href="#contact" style="color:white; text-decoration:none;">문의하기</a></li>
    <li><a href="#parking" style="color:white; text-decoration:none;">주차장 안내</a></li>
    <li><a href="#stay" style="color:white; text-decoration:none;">숙박시설 안내</a></li>
  </ul>
</nav>

  <section class="hero">
    <div class="container">
      <h1>누구나 환영합니다</h1>
      <p>
        서울면목북부 회중은 성경을 배우고 서로를 격려하며,
        누구나 편안하게 방문할 수 있는 따뜻한 모임입니다.
      </p>
      <p class="sub">
        집회에 참석해 보시거나 성경에 대해 알아보고 싶으시다면
        편안한 마음으로 살펴보시기 바랍니다.
      </p>
      <div class="buttons">
        <a href="#meeting" class="primary">집회 안내 보기</a>
        <a href="#contact" class="secondary">문의하기</a>
      </div>
    </div>
  </section>
</body>
</html>
