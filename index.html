<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>서울면목북부</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 700px;
      padding: 20px;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
    }
    p {
      font-size: 1.1rem;
      color: #555;
      line-height: 1.6;
    }
    .buttons {
      margin-top: 30px;
    }
    a {
      display: inline-block;
      margin: 8px;
      padding: 12px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 0.95rem;
    }
    .primary {
      background: #111;
      color: #fff;
    }
    .secondary {
      border: 1px solid #ccc;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>누구나 환영합니다</h1>
    <p>
      서울면목북부 회중은 성경을 배우고 서로를 격려하며,<br />
      누구나 편안하게 방문할 수 있는 따뜻한 모임입니다.
    </p>
    <div class="buttons">
      <a href=\"#\">집회 안내 보기</a>
      <a href=\"#\" class=\"secondary\">문의하기</a>
    </div>
  </div>
</body>
</html>
